  <g fill="#c29a70" opacity=".8">
    <circle cx="1032" cy="300" r="6"/><circle cx="1020" cy="366" r="6"/><circle cx="1129" cy="331" r="6"/><circle cx="1007" cy="328" r="5"/><circle cx="1074" cy="474" r="5"/><circle cx="1090" cy="432" r="5"/>
