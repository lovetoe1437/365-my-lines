<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf8f2"/>
      <stop offset="0.58" stop-color="#f4eee3"/>
      <stop offset="1" stop-color="#e7d8c5"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#765f4c"/>
      <stop offset="0.65" stop-color="#523e30"/>
      <stop offset="1" stop-color="#3f2f25"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="190%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#503825" flood-opacity=".23"/>
    </filter>
    <pattern id="paper" width="5" height="5" patternUnits="userSpaceOnUse">
      <path d="M0 4.5H5" stroke="#8b7159" stroke-opacity=".035"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#paper)"/>
  <circle cx="1040" cy="100" r="260" fill="#a47b55" opacity=".07"/>
  <circle cx="220" cy="20" r="260" fill="#fff" opacity=".5"/>

  <g transform="translate(92 145)">
    <text x="0" y="0" fill="#80664f" font-family="Georgia, serif" font-size="18" letter-spacing="5">ЛИЧНАЯ ЦИФРОВАЯ КНИГА</text>
    <text x="0" y="112" fill="#2d261f" font-family="Georgia, serif" font-size="94">365 моих строк</text>
    <text x="4" y="174" fill="#675a50" font-family="Georgia, serif" font-size="28">Некоторые страницы невозможно написать вовремя.</text>
    <text x="4" y="216" fill="#675a50" font-family="Georgia, serif" font-size="28">Поэтому эта книга продолжается здесь.</text>
    <text x="4" y="296" fill="#806f62" font-family="Georgia, serif" font-size="20">Один день · одна мысль</text>
  </g>

  <g transform="translate(790 72) rotate(-1 160 245)" filter="url(#shadow)">
    <rect x="10" y="16" width="322" height="490" rx="3" fill="#f7efe4"/>
    <path d="M326 18h16v488h-16" fill="#e5d8c6"/>
    <rect width="326" height="490" rx="2" fill="url(#cover)"/>
    <rect x="25" y="25" width="276" height="440" fill="none" stroke="#d7bea1" stroke-opacity=".55"/>
    <text x="163" y="92" text-anchor="middle" fill="#d9bea0" font-family="Georgia, serif" font-size="15">✦</text>
    <text x="163" y="265" text-anchor="middle" fill="#f5ebde" font-family="Georgia, serif" font-size="112">365</text>
    <text x="163" y="312" text-anchor="middle" fill="#f5ebde" font-family="Georgia, serif" font-size="29" letter-spacing="5">МОИХ СТРОК</text>
    <text x="163" y="426" text-anchor="middle" fill="#d9c7b2" font-family="Georgia, serif" font-size="11" letter-spacing="3">ОДИН ДЕНЬ · ОДНА МЫСЛЬ</text>
    <path d="M245 438h18v80l-9-14-9 14z" fill="#9c463a"/>
  </g>

  <g fill="none" stroke="#b18a62" stroke-width="2" opacity=".7">
    <path d="M1110 555C1074 480 1080 374 1032 300"/>
    <path d="M1074 474c-30-40-45-70-54-108M1090 432c24-33 35-67 39-101M1052 408c-24-25-38-51-45-80"/>
