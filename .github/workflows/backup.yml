name: Резервная копия D1

on:
  schedule:
    - cron: "30 3 * * 6"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backup:
    name: Экспорт личной базы
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm

      - run: npm ci

      - name: Экспорт D1
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm run backup:d1

      - name: Сообщить об отсутствии токена
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "Backup skipped: add CLOUDFLARE_API_TOKEN in GitHub Actions secrets."

      - name: Сохранить зашифрованный архив GitHub
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/upload-artifact@v4
        with:
          name: d1-backup-${{ github.run_id }}
          path: backups/*.sql
          if-no-files-found: error
          retention-days: 30
