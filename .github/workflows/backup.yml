name: Полная резервная копия

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backup:
    name: Экспорт личной базы
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_R2_BACKUP_TOKEN: ${{ secrets.CLOUDFLARE_R2_BACKUP_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 9be9dbd05e5041652082ee0918150abf
      R2_SOURCE_BUCKET: 365-my-lines-images
      R2_BACKUP_BUCKET: 365-my-lines-backups

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm

      - run: npm ci

      - name: Экспорт D1
        run: npm run backup:d1

      - name: Сохранить базу и фотографии в закрытый R2
        run: npm run backup:r2

      - name: Сохранить зашифрованный архив GitHub
        uses: actions/upload-artifact@v4
        with:
          name: full-backup-${{ github.run_id }}
          path: backups/*.sql
          if-no-files-found: error
          retention-days: 30
